name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make verify
      - run: make paper-figures
      - run: make privacy
